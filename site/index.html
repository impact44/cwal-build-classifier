<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>cwal.gg Guides</title>
	<meta name="description" content="Build-order guides and the build identifier behind cwal.gg." />
	<style>
		:root { --bg: #f6f6f4; --panel: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc; --accent: #2f5fd0; }
		@media (prefers-color-scheme: dark) {
			:root { --bg: #141413; --panel: #1c1c1a; --ink: #ecebe6; --muted: #9b9a93; --line: #2e2d2a; --accent: #7fa2ff; }
		}
		body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
		main { max-width: 720px; margin: 0 auto; padding: 40px 16px; }
		h1 { margin: 0 0 6px; font-size: 24px; }
		p { color: var(--muted); margin: 0 0 24px; }
		a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; color: inherit; text-decoration: none; }
		a.card:hover { border-color: var(--accent); }
		a.card strong { color: var(--accent); }
	</style>
</head>
<body>
	<main>
		<h1>cwal.gg guides</h1>
		<p>
			The open part of <a href="https://cwal.gg">cwal.gg</a>'s build orders. Contributions welcome on
			<a href="https://github.com/dxrsz/cwal-guides">GitHub</a>.
		</p>
		<a class="card" href="guides/"><strong>Build-order guides</strong><br />Write a build-order guide and preview it exactly as cwal.gg renders it.</a>
		<a class="card" href="identifier/"><strong>Build identifier sandbox</strong><br />Write a build definition and test it against your own replays.</a>
	</main>
</body>
</html>
