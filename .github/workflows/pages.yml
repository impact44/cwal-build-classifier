name: Pages

# Builds the sandbox into site/ (build-site.mjs) and publishes it to GitHub
# Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the classifier and every definition
        run: cargo test

      # The corpus timelines take a few minutes to simulate; reuse them while
      # the corpus and the extractor are unchanged (the build also checks a
      # hash of the engine itself and resimulates on a mismatch).
      - uses: actions/cache@v4
        with:
          path: target/corpus-timelines
          key: corpus-timelines-${{ hashFiles('corpus/index.json', 'crate/src/**', 'wasm/src/**') }}

      - name: Build the sandbox
        run: node build-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
