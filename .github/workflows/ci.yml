name: CI

# Pull requests: every definition must parse and pass the slug/time checks,
# and the identifier's tests must pass.
on:
  pull_request:

jobs:
  identifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix guides && npm run check --prefix guides
